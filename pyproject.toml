[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dts"
version = "2.0.0"
description = "Dialogue Translation System — Traductor de diálogos de videojuegos (GameMaker) usando IA"
readme = "README.md"
requires-python = ">=3.11"
license = "CC BY-NC 4.0"
authors = [
    { name = "Frask Coffee" },
]
keywords = [
    "gamedev", "translation", "gamemaker", "undertale",
    "deltarune", "gemini", "ollama", "cli", "gui",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: GTK",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Natural Language :: English",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "google-genai>=1.0.0",
    "ollama>=0.6.0",
    "openai>=1.0.0",
    "anthropic>=0.30.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "ttkbootstrap>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/elfrask/dts"
Repository = "https://github.com/elfrask/dts"
Documentation = "https://github.com/elfrask/dts/tree/main/docs"
Tracker = "https://github.com/elfrask/dts/issues"

[project.scripts]
dts = "src.main:main"

[tool.setuptools]
package = ["src"]