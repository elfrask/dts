[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dts"
version = "2.0.0"
description = "Dialogue Translation System - Traductor de diálogos de videojuegos (GameMaker) usando Google Gemini"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "google-genai>=1.0.0",
    "ollama>=0.6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "ttkbootstrap>=1.10.0",
]

[project.scripts]
dts = "src.main:main"
